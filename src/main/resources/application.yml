spring:
  application:
    name: mini-rtb-engine
  datasource:
    url: jdbc:h2:mem:rtb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080

app:
  demo:
    reset-enabled: true
